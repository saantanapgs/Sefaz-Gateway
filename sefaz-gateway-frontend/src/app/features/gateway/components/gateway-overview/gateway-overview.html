<section class="indicadores" aria-label="Indicadores">
  <app-stat-card rotulo="Total de gateways" [valor]="total()" />
  <app-stat-card rotulo="Ativos" [valor]="ativos()" variante="sucesso" />
  <app-stat-card rotulo="Inativos" [valor]="inativos()" />
  <app-stat-card rotulo="Com problemas" [valor]="comProblemas()" variante="perigo" />
</section>

<div class="paineis">
  <section class="cartao">
    <header class="cartao__topo">
      <div>
        <span class="etiqueta">Atenção</span>
        <h2 class="cartao__titulo">Requer atenção</h2>
      </div>
    </header>

    @if (atencao().length === 0) {
      <p class="ok">Nenhum gateway ativo com backends fora do ar ou degradados.</p>
    } @else {
      <ul class="atencao">
        @for (item of atencao(); track item.gateway.id) {
          <li>
            <button type="button" class="atencao__linha" (click)="detalhes.emit(item.gateway)">
              <span class="atencao__nome">{{ item.gateway.nome }}</span>
              <span class="atencao__chips">
                @for (backend of item.problemas; track backend.id) {
                  <app-status-badge [status]="backend.status!" />
                }
              </span>
              <app-icon nome="chevron" [tamanho]="15" />
            </button>
          </li>
        }
      </ul>
      @if (atencaoExtras() > 0) {
        <p class="mais">e mais {{ atencaoExtras() }} gateway(s)</p>
      }
    }
  </section>
</div>
