<div class="shell">
  <aside class="shell__sidebar">
    <div class="shell__marca">Sefaz Gateway</div>

    <span class="shell__grupo-titulo">Principal</span>
    <nav class="shell__nav">
      <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>
      <a routerLink="/gateways" routerLinkActive="ativo">
        Gateways
      </a>
    </nav>

    <div class="shell__usuario">
      <span class="shell__usuario-avatar">U</span>
      <div class="shell__usuario-info">
        <span class="shell__usuario-nome">Usuário</span>
        <span class="shell__usuario-papel">Equipe Gateway</span>
      </div>
    </div>
  </aside>

  <div class="shell__conteudo">
    <header class="shell__header">
      <span>Gerenciamento de Gateways</span>
    </header>
    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
</div>
